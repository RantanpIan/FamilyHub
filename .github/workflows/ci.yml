name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build:client

  e2e:
    name: Supabase-backed Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: setup-supabase-cli
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: supabase --version
      - run: supabase start
      - name: Configure disposable Supabase browser test values
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_E2E_URL=$API_URL"
            echo "SUPABASE_E2E_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_E2E_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_E2E_EMAIL_URL=http://127.0.0.1:54324"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Stop local Supabase
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop

  auth-rls:
    name: Supabase Auth, family and resource ACL RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: setup-supabase-cli
        uses: supabase/setup-cli@v3
        with:
          version: 2.121.0
      - run: supabase --version
      - run: supabase start
      - name: Reset disposable database and apply all migrations
        run: supabase db reset --local
      - name: Configure ephemeral local Supabase test credentials
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Run all resource ACL RLS cases (require 16/16)
        shell: bash
        run: |
          set -euo pipefail
          npm run test:integration -- tests/integration/resource-access.rls.test.ts --reporter=json --outputFile=acl-rls-results.json
          node <<'NODE'
          const fs = require("node:fs");

          const reportPath = "acl-rls-results.json";
          if (!fs.existsSync(reportPath)) {
            throw new Error(`Vitest JSON report is missing: ${reportPath}`);
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const expectedSuiteSuffix = "/tests/integration/resource-access.rls.test.ts";
          const suites = report.testResults;
          if (!Array.isArray(suites) || suites.length !== 1) {
            throw new Error("Expected exactly one Vitest test suite in the ACL report.");
          }

          const suite = suites[0];
          const suitePath = typeof suite.name === "string"
            ? suite.name.replaceAll("\\", "/")
            : "";
          if (!suitePath.endsWith(expectedSuiteSuffix) || suite.status !== "passed") {
            throw new Error(`Unexpected or failed ACL test suite: ${suitePath || "(missing name)"}`);
          }

          const expectedCounts = {
            numTotalTests: 16,
            numPassedTests: 16,
            numFailedTests: 0,
            numPendingTests: 0,
            numTodoTests: 0,
          };
          for (const [key, expected] of Object.entries(expectedCounts)) {
            if (report[key] !== expected) {
              throw new Error(`ACL report ${key}: expected ${expected}, received ${report[key]}`);
            }
          }

          const assertions = suite.assertionResults;
          if (
            report.success !== true ||
            !Array.isArray(assertions) ||
            assertions.length !== 16 ||
            assertions.some((assertion) => assertion.status !== "passed")
          ) {
            throw new Error("ACL report is unsuccessful, incomplete, skipped, or contains non-passing tests.");
          }

          console.log("ACL RLS gate passed: expected suite, 16 passed, 0 failed/skipped/todo.");
          NODE
      - run: npm run test:integration
      - name: Stop local Supabase
        if: always() && steps.setup-supabase-cli.outcome == 'success'
        run: supabase stop
